<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Top up Clouds — Admin</title><style>body{margin:0;background:#080b11;color:#f4f7fc;font-family:system-ui;padding:24px}.wrap{max-width:1100px;margin:auto}.box{background:#101620;border:1px solid #263244;border-radius:16px;padding:18px;margin:14px 0}input,select,button,textarea{padding:10px;border-radius:9px;border:1px solid #263244;background:#090e15;color:white}button{cursor:pointer;background:#65f3aa;color:#06120b;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:14px;background:#141e2b;border-radius:12px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.muted{color:#91a0b4;font-size:12px}table{width:100%;border-collapse:collapse;font-size:12px}td,th{border-bottom:1px solid #263244;padding:8px;text-align:left}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}table{display:block;overflow:auto}}</style></head><body><div class="wrap"><h1>Top up Clouds — Admin</h1><p class="muted">Panel internal. Admin key hanya dikirim ke API lewat header dan jangan dibagikan ke pembeli.</p><div class="box"><div class="row"><input id="key" type="password" placeholder="ADMIN_KEY" style="flex:1"><button onclick="saveKey()">Simpan key</button></div></div><div class="grid"><div class="stat">Users <b id="users">-</b></div><div class="stat">Produk aktif <b id="products">-</b></div><div class="stat">Kode tersedia <b id="codes">-</b></div><div class="stat">Order paid <b id="paid">-</b></div></div><div class="box"><h2>Tambah produk</h2><div class="row"><input id="provider" placeholder="redfinger / ugcloud / genplay"><input id="name" placeholder="Nama produk"><select id="duration"><option>1</option><option>3</option><option>7</option><option>30</option></select><input id="price" type="number" placeholder="Harga IDR"><button onclick="addProduct()">Tambah</button></div></div><div class="box"><h2>Tambah Redeem Code</h2><div class="row"><select id="productSelect" style="flex:1"></select></div><textarea id="codesInput" rows="6" style="width:100%;margin:8px 0" placeholder="Satu Redeem Code per baris"></textarea><button onclick="addCodes()">Masukkan stok</button></div><div class="box"><h2>Produk</h2><div id="productTable"></div></div><div class="box"><h2>Order terbaru</h2><div id="orderTable"></div></div></div><script>let key=localStorage.getItem('tc_admin_key')||'';document.getElementById('key').value=key;const h=()=>({'Content-Type':'application/json','x-admin-key':key});async function api(p,o={}){o.headers={...h(),...(o.headers||{})};const r=await fetch(p,o);const d=await r.json();if(!r.ok)throw Error(d.error||'Error');return d}function saveKey(){key=document.getElementById('key').value;localStorage.setItem('tc_admin_key',key);load()}async function load(){try{const [s,p,c,o]=await Promise.all([api('/api/admin/stats'),api('/api/admin/products'),api('/api/admin/codes'),api('/api/admin/orders')]);users.textContent=s.users;products.textContent=s.products;codes.textContent=s.available_codes;paid.textContent=s.paid_orders;productSelect.innerHTML=p.map(x=>`<option value="${x.id}">${x.id} — ${x.provider} — ${x.name} — ${x.duration_days}H</option>`).join('');productTable.innerHTML='<table><tr><th>ID</th><th>Provider</th><th>Produk</th><th>Durasi</th><th>Harga</th><th>Aktif</th></tr>'+p.map(x=>`<tr><td>${x.id}</td><td>${x.provider}</td><td>${x.name}</td><td>${x.duration_days}H</td><td>${x.price}</td><td>${x.active}</td></tr>`).join('')+'</table>';orderTable.innerHTML='<table><tr><th>Order</th><th>Email</th><th>Produk</th><th>Status</th><th>Kode</th></tr>'+o.map(x=>`<tr><td>${x.id}</td><td>${x.email||'-'}</td><td>${x.name}</td><td>${x.payment_status}</td><td>${x.redeem_code||'-'}</td></tr>`).join('')+'</table>'}catch(e){alert(e.message)}}async function addProduct(){try{await api('/api/admin/products',{method:'POST',body:JSON.stringify({provider:provider.value,name:name.value,duration_days:Number(duration.value),price:Number(price.value)})});alert('Produk ditambahkan');load()}catch(e){alert(e.message)}}async function addCodes(){try{const codes=codesInput.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const d=await api('/api/admin/codes',{method:'POST',body:JSON.stringify({product_id:Number(productSelect.value),codes})});alert('Berhasil masuk: '+d.count);codesInput.value='';load()}catch(e){alert(e.message)}}load();</script></body></html>
